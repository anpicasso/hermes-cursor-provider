name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'h2>=4.2,<5' 'protobuf>=6.33.5,<7' 'httpx>=0.28,<1' pytest
      - run: pytest -q
      - run: pip install 'git+https://github.com/NousResearch/hermes-agent.git@main'
      - run: hermes plugins validate provider --json
